[build]
builder = "NIXPACKS"
buildCommand = "cd backend && npm ci && npx prisma generate && cd ../frontend && npm ci && npm run build"

[deploy]
startCommand = "cd backend && npx prisma migrate deploy && npx tsx prisma/seed.ts && node src/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/healthz"
healthcheckTimeout = 300
