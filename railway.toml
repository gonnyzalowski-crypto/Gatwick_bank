[build]
builder = "NIXPACKS"
buildCommand = "cd backend && npm ci && npx prisma generate && cd ../frontend && npm ci && npm run build"

[deploy]
startCommand = "cd backend && npx prisma migrate deploy && npx tsx prisma/seed.ts && NODE_ENV=production node src/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/healthz"
healthcheckTimeout = 300

[[deploy.environmentVariables]]
name = "NODE_ENV"
value = "production"
